name: main_dart
description: "FeePal: Automated school fee management and reminder system."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# Current version for FeePal-v1.0.17.apk naming
version: 1.0.17+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  file_picker: ^11.0.2
  excel: ^4.0.6
  path: ^1.9.1
  http: ^1.6.0
  intl: ^0.20.2
  firebase_storage: ^13.3.0
  image_picker: ^1.2.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.3.2
  firebase_messaging: ^16.2.0
  googleapis_auth: ^2.3.0
  flutter_local_notifications: ^21.0.0
  confetti: ^0.7.0
  csv: 5.0.2
  pdf: ^3.11.1
  printing: ^5.13.2
  package_info_plus: ^9.0.1
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_barcode_scanning: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/app_icon.png"